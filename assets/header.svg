<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0f24"/><stop offset=".55" stop-color="#171c47"/><stop offset="1" stop-color="#341a5c"/>
  </linearGradient>
  <linearGradient id="tx" x1="0" x2="1">
    <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a5b4fc"/><stop offset="1" stop-color="#f0abfc"/>
  </linearGradient>
  <linearGradient id="wv" x1="0" x2="1">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <radialGradient id="gl" cx=".85" cy=".1" r=".6">
    <stop offset="0" stop-color="#c084fc" stop-opacity=".35"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="cl"><rect width="880" height="250" rx="22"/></clipPath>
</defs>
<style>
  .w1{animation:m 12s linear infinite}
  .w2{animation:m 18s linear infinite reverse}
  .w3{animation:m 26s linear infinite}
  @keyframes m{from{transform:translateX(0)}to{transform:translateX(-440px)}}
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<g clip-path="url(#cl)">
  <rect width="880" height="250" fill="url(#bg)"/>
  <rect width="880" height="250" fill="url(#gl)"/>
  <g fill="#fff">
    <circle class="tw" cx="640" cy="40" r="1.4"/>
    <circle class="tw" cx="760" cy="70" r="1" style="animation-delay:1s"/>
    <circle class="tw" cx="820" cy="30" r="1.6" style="animation-delay:2s"/>
    <circle class="tw" cx="700" cy="110" r="1" style="animation-delay:.5s"/>
    <circle class="tw" cx="560" cy="60" r="1" style="animation-delay:1.6s"/>
  </g>
  <g fill="none" stroke="url(#wv)" stroke-linecap="round">
    <path class="w3" d="M0 196 Q110 176 220 196 T440 196 T660 196 T880 196 T1100 196 T1320 196" stroke-width="1.5" opacity=".25"/>
    <path class="w2" d="M0 208 Q110 182 220 208 T440 208 T660 208 T880 208 T1100 208 T1320 208" stroke-width="2" opacity=".45"/>
    <path class="w1" d="M0 222 Q110 196 220 222 T440 222 T660 222 T880 222 T1100 222 T1320 222" stroke-width="2.5" opacity=".85"/>
  </g>
  <text class="f1" x="56" y="58" font-size="14" font-weight="700" letter-spacing="3" fill="#7dd3fc">HI THERE, I'M</text>
  <text class="f1" x="54" y="114" font-size="56" font-weight="800" fill="url(#tx)">Hongbi Kim</text>
  <text class="f2" x="56" y="148" font-size="19" font-weight="600" fill="#e6edf3">AI Engineer</text>
  <text class="f3" x="56" y="176" font-size="13" font-weight="600" letter-spacing="1.5" fill="#8b949e">RAG  ·  AGENT  ·  AX</text>
</g>
</svg>
